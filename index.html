<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XG5000 Mobile PLC Simulator - XBC-S Series</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        xg: {
                            bg: '#181b20',
                            panel: '#232731',
                            border: '#363c4a',
                            accent: '#00adb5',
                            active: '#40c057',
                            off: '#4c566a',
                            grid: '#2a2e39',
                            text: '#eceff4'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        input, select, textarea {
            user-select: text;
            -webkit-user-select: text;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4c566a;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-track {
            background: #181b20;
        }
        .canvas-container {
            overflow: auto;
            background-color: #14171c;
            background-image: radial-gradient(circle, #272c36 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-xg-bg text-xg-text font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Header Bar -->
    <header class="bg-xg-panel border-b border-xg-border px-3 py-2 flex items-center justify-between shadow-md select-none shrink-0">
        <div class="flex items-center gap-2">
            <div class="bg-xg-accent text-gray-950 font-black px-2 py-0.5 rounded text-xs tracking-wider">XBC-S</div>
            <h1 class="font-bold text-xs sm:text-sm tracking-tight text-white flex items-center gap-1.5">
                <span class="hidden sm:inline">XG5000</span>
                <!-- Model Selector Dropdown -->
        <select id="model-select" onchange="changeModel()" class="bg-xg-bg text-xg-accent font-mono font-bold text-xs px-2 py-1 rounded border border-xg-border focus:outline-none">
            <optgroup label="릴레이 출력 타입 (Relay Output)">
                <option value="XBC-DR14S">XBC-DR14S (입력 8점 / 릴레이출력 6점)</option>
                <option value="XBC-DR20S">XBC-DR20S (입력 12점 / 릴레이출력 8점)</option>
                <option value="XBC-DR32S" selected>XBC-DR32S (입력 16점 / 릴레이출력 16점)</option>
                <option value="XBC-DR60S">XBC-DR60S (입력 36점 / 릴레이출력 24점)</option>
            </optgroup>
            <optgroup label="TR 출력 타입 (Transistor Output)">
                <option value="XBC-DN14S">XBC-DN14S (입력 8점 / TR출력 6점)</option>
                <option value="XBC-DN20S">XBC-DN20S (입력 12점 / TR출력 8점)</option>
                <option value="XBC-DN32S">XBC-DN32S (입력 16점 / TR출력 16점)</option>
                <option value="XBC-DN60S">XBC-DN60S (입력 36점 / TR출력 24점)</option>
            </optgroup>
        </select>
        <span id="mode-badge" class="bg-red-500/20 text-red-400 text-xs px-2 py-0.5 rounded border border-red-500/40 font-mono font-semibold">STOP</span>
            </h1>
        </div>
        
        <!-- Controls & Utility Buttons -->
        <div class="flex items-center gap-1.5">
            <button id="btn-run" onclick="toggleRunMode()" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded text-xs font-bold flex items-center gap-1 shadow transition">
                <i class="fa-solid fa-play text-xs"></i> <span>RUN</span>
            </button>
            <button onclick="openExampleModal()" class="bg-xg-border hover:bg-gray-600 text-xs px-2 py-1 rounded font-medium">
                <i class="fa-solid fa-folder-open"></i> <span class="hidden sm:inline">예제</span>
            </button>
            <button onclick="toggleIOPanel()" class="bg-xg-border hover:bg-gray-600 text-xs px-2 py-1 rounded font-medium">
                <i class="fa-solid fa-microchip"></i> <span>I/O</span>
            </button>
            <button onclick="openMenuModal()" class="bg-xg-border hover:bg-gray-600 text-xs p-1 rounded">
                <i class="fa-solid fa-ellipsis-vertical text-sm px-1"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Ladder Grid Canvas View -->
        <main class="flex-1 canvas-container relative p-2 sm:p-3 overflow-auto" id="canvas-wrapper">
            <div id="ladder-canvas" class="min-w-[720px] flex flex-col gap-0">
                <!-- Rungs will be dynamically rendered here -->
            </div>
            
            <div class="mt-3 flex gap-2">
                <button onclick="addRung()" class="bg-xg-panel hover:bg-xg-border text-xg-accent border border-xg-accent/40 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1 font-semibold shadow">
                    <i class="fa-solid fa-plus"></i> <span>새 렁(Rung) 추가</span>
                </button>
            </div>
        </main>

        <!-- Virtual I/O Console & Data Memory Monitor (Drawer) -->
        <aside id="io-panel" class="bg-xg-panel border-t md:border-t-0 md:border-l border-xg-border w-full md:w-80 shrink-0 flex flex-col shadow-2xl transition-all duration-300 max-h-[48vh] md:max-h-full">
            <div class="bg-gray-800/80 px-3 py-1.5 border-b border-xg-border flex justify-between items-center text-xs font-bold text-gray-300">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-microchip text-xg-accent"></i> XBC 릴레이/TR I/O 콘솔</span>
                <button onclick="toggleIOPanel()" class="md:hidden text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="p-3 overflow-y-auto flex-1 space-y-3 text-xs">
                <!-- Inputs Section -->
                <div>
                    <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1 flex justify-between">
                        <span>입력 (Input P) - <span id="input-count-label">16점</span></span>
                        <span class="text-[10px] text-xg-accent">터치하여 ON/OFF</span>
                    </div>
                    <div class="grid grid-cols-4 gap-1.5" id="input-switches">
                        <!-- Populated dynamically based on model -->
                    </div>
                </div>

                <!-- Relay Outputs Section -->
                <div>
                    <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1 flex justify-between">
                        <span>출력 접점 (Relay/TR P) - <span id="output-count-label">16점</span></span>
                        <span id="output-type-label" class="text-[10px] text-yellow-400 font-mono">RELAY</span>
                    </div>
                    <div class="grid grid-cols-4 gap-1.5" id="output-lamps">
                        <!-- Populated dynamically based on model -->
                    </div>
                </div>

                <!-- Timer / Counter / Data Register Monitor -->
                <div>
                    <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1 flex justify-between">
                        <span>실시간 메모리 모니터 (T/C/D)</span>
                    </div>
                    <div id="memory-monitor" class="bg-xg-bg p-2 rounded border border-xg-border font-mono space-y-1 max-h-32 overflow-y-auto">
                        <div class="text-gray-500 italic text-center text-[11px]">동작 중인 데이터 레지스터 없음</div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Bottom Palette Bar (Ladder Tool Selector) -->
    <footer class="bg-xg-panel border-t border-xg-border p-1.5 shrink-0 select-none">
        <div class="text-[11px] text-gray-400 mb-1 px-1 flex justify-between items-center">
            <span>도구 선택 후 래더 셀을 터치하세요</span>
            <span id="selected-tool-name" class="text-xg-accent font-bold">선택: A접점 (F3)</span>
        </div>
        <div class="flex items-center gap-1 overflow-x-auto pb-1 scrollbar-none" id="tool-palette">
            <!-- Tool Selection Buttons -->
            <button data-tool="NO" onclick="selectTool('NO')" class="tool-btn active bg-xg-accent text-gray-950 border border-xg-accent font-bold rounded px-2 py-1 text-xs flex flex-col items-center min-w-[50px]">
                <span class="font-mono text-sm leading-none">┤ ├</span>
                <span class="text-[10px] mt-1">A접점</span>
            </button>
            <button data-tool="NC" onclick="selectTool('NC')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[50px]">
                <span class="font-mono text-sm leading-none">┤/├</span>
                <span class="text-[10px] mt-1">B접점</span>
            </button>
            <button data-tool="POS" onclick="selectTool('POS')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[50px]">
                <span class="font-mono text-sm leading-none">┤P├</span>
                <span class="text-[10px] mt-1">양변환</span>
            </button>
            <button data-tool="NEG" onclick="selectTool('NEG')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[50px]">
                <span class="font-mono text-sm leading-none">┤N├</span>
                <span class="text-[10px] mt-1">음변환</span>
            </button>
            <button data-tool="COIL" onclick="selectTool('COIL')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[50px]">
                <span class="font-mono text-sm leading-none">─( )─</span>
                <span class="text-[10px] mt-1">출력</span>
            </button>
            <button data-tool="SET" onclick="selectTool('SET')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[50px]">
                <span class="font-mono text-xs font-bold leading-none">─(S)─</span>
                <span class="text-[10px] mt-1">SET</span>
            </button>
            <button data-tool="RST" onclick="selectTool('RST')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[50px]">
                <span class="font-mono text-xs font-bold leading-none">─(R)─</span>
                <span class="text-[10px] mt-1">RST</span>
            </button>
            <!-- Applied Instructions -->
            <button data-tool="TON" onclick="selectTool('TON')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[56px]">
                <span class="font-mono text-xs font-bold leading-none">[TON]</span>
                <span class="text-[10px] mt-1">타이머</span>
            </button>
            <button data-tool="CTU" onclick="selectTool('CTU')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[56px]">
                <span class="font-mono text-xs font-bold leading-none">[CTU]</span>
                <span class="text-[10px] mt-1">카운터</span>
            </button>
            <button data-tool="MOV" onclick="selectTool('MOV')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[56px]">
                <span class="font-mono text-xs font-bold leading-none">[MOV]</span>
                <span class="text-[10px] mt-1">전송</span>
            </button>
            <button data-tool="INC" onclick="selectTool('INC')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[52px]">
                <span class="font-mono text-xs font-bold leading-none">[INC]</span>
                <span class="text-[10px] mt-1">+1 증가</span>
            </button>
            <button data-tool="DEC" onclick="selectTool('DEC')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[52px]">
                <span class="font-mono text-xs font-bold leading-none">[DEC]</span>
                <span class="text-[10px] mt-1">-1 감소</span>
            </button>
            <button data-tool="CMP" onclick="selectTool('CMP')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[58px]">
                <span class="font-mono text-xs font-bold leading-none">[>] 비교</span>
                <span class="text-[10px] mt-1">비교접점</span>
            </button>
            <button data-tool="LINE_V" onclick="selectTool('LINE_V')" class="tool-btn bg-xg-bg text-gray-200 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[48px]">
                <span class="font-mono text-sm leading-none">│ OR</span>
                <span class="text-[10px] mt-1">세로선</span>
            </button>
            <button data-tool="ERASE" onclick="selectTool('ERASE')" class="tool-btn bg-xg-bg text-red-400 border border-xg-border rounded px-2 py-1 text-xs flex flex-col items-center min-w-[48px]">
                <i class="fa-solid fa-eraser text-sm"></i>
                <span class="text-[10px] mt-1">지우개</span>
            </button>
        </div>
    </footer>

    <!-- Symbol & Instruction Config Modal -->
    <div id="modal-address" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-xg-panel border border-xg-border rounded-xl w-full max-w-sm p-4 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-xg-border pb-2">
                <h3 id="modal-title" class="font-bold text-sm text-xg-accent flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square"></i> 명령어 및 주소 설정
                </h3>
                <button onclick="closeAddressModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <!-- Address S1 Field -->
                <div>
                    <label id="lbl-addr1" class="block text-gray-400 mb-1 font-medium">PLC 디바이스 주소 / 소스 (S1)</label>
                    <div class="flex gap-1 mb-1.5 overflow-x-auto">
                        <button onclick="quickSetAddr('P')" class="bg-xg-bg text-gray-300 px-2 py-0.5 rounded border border-xg-border font-mono text-[11px]">P</button>
                        <button onclick="quickSetAddr('M')" class="bg-xg-bg text-gray-300 px-2 py-0.5 rounded border border-xg-border font-mono text-[11px]">M</button>
                        <button onclick="quickSetAddr('K')" class="bg-xg-bg text-gray-300 px-2 py-0.5 rounded border border-xg-border font-mono text-[11px]">K(상수)</button>
                        <button onclick="quickSetAddr('T')" class="bg-xg-bg text-gray-300 px-2 py-0.5 rounded border border-xg-border font-mono text-[11px]">T</button>
                        <button onclick="quickSetAddr('C')" class="bg-xg-bg text-gray-300 px-2 py-0.5 rounded border border-xg-border font-mono text-[11px]">C</button>
                        <button onclick="quickSetAddr('D')" class="bg-xg-bg text-gray-300 px-2 py-0.5 rounded border border-xg-border font-mono text-[11px]">D</button>
                    </div>
                    <input type="text" id="input-address" class="w-full bg-xg-bg border border-xg-border rounded px-3 py-2 text-white font-mono uppercase text-sm focus:outline-none focus:border-xg-accent" placeholder="예: P0000, M0000, D0000, K10">
                </div>

                <!-- Secondary Operand / Preset (S2 / Destination) -->
                <div id="op2-container" class="hidden">
                    <label id="lbl-addr2" class="block text-gray-400 mb-1 font-medium">타겟 주소 / 설정값 (S2 / D)</label>
                    <input type="text" id="input-op2" class="w-full bg-xg-bg border border-xg-border rounded px-3 py-2 text-white font-mono uppercase text-sm focus:outline-none focus:border-xg-accent" placeholder="예: D0000, K50">
                    <p id="op2-desc" class="text-[10px] text-gray-400 mt-1">* TON 타임: 10 = 1초 단위입니다 (예: 50 = 5초)</p>
                </div>

                <!-- Comparison Operator Choice -->
                <div id="cmp-container" class="hidden">
                    <label class="block text-gray-400 mb-1 font-medium">비교 연산자 선택</label>
                    <select id="select-cmp-op" class="w-full bg-xg-bg border border-xg-border rounded px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-xg-accent">
                        <option value="=">=</option>
                        <option value="<>">&lt;&gt;</option>
                        <option value=">">&gt;</option>
                        <option value=">=">&gt;=</option>
                        <option value="<">&lt;</option>
                        <option value="<=">&lt;=</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-xg-border">
                <button onclick="closeAddressModal()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs">취소</button>
                <button onclick="saveAddressModal()" class="px-4 py-1.5 bg-xg-accent hover:opacity-90 text-gray-950 font-bold rounded text-xs">확인</button>
            </div>
        </div>
    </div>

    <!-- Example Selector Modal -->
    <div id="modal-example" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-xg-panel border border-xg-border rounded-xl w-full max-w-md p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-xg-border pb-2">
                <h3 class="font-bold text-sm text-xg-accent flex items-center gap-1.5">
                    <i class="fa-solid fa-book-open"></i> XBC-S 실습 예제 선택
                </h3>
                <button onclick="closeExampleModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-2 max-h-80 overflow-y-auto text-xs">
                <button onclick="loadExample('self_hold')" class="w-full text-left p-2.5 bg-xg-bg hover:bg-xg-border rounded border border-xg-border transition flex flex-col gap-0.5">
                    <span class="font-bold text-white text-sm">1. 자기유지 회로 (Self-Holding)</span>
                    <span class="text-gray-400 text-[11px]">P0000(시작)으로 M0000 자기유지, P0001(정지)로 해제하는 기본 제어 회로</span>
                </button>
                <button onclick="loadExample('timer_ton')" class="w-full text-left p-2.5 bg-xg-bg hover:bg-xg-border rounded border border-xg-border transition flex flex-col gap-0.5">
                    <span class="font-bold text-white text-sm">2. 온-딜레이 타이머 제어 (TON)</span>
                    <span class="text-gray-400 text-[11px]">P0000 입력 후 3초(K30) 지정 지연 시간 이후 출력 램프가 ON 되는 타이머 회로</span>
                </button>
                <button onclick="loadExample('cnt_mov_inc')" class="w-full text-left p-2.5 bg-xg-bg hover:bg-xg-border rounded border border-xg-border transition flex flex-col gap-0.5">
                    <span class="font-bold text-white text-sm">3. 카운터 & MOV/INC 데이터 응용 회로</span>
                    <span class="text-gray-400 text-[11px]">P0000 입력마다 D0000 1씩 증가(INC), P0001로 K10 이동(MOV), 비교[> D0000 K5]로 출력 켜짐</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Menu Modal -->
    <div id="modal-menu" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-xg-panel border border-xg-border rounded-xl w-full max-w-sm p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-xg-border pb-2">
                <h3 class="font-bold text-sm text-gray-200">설정 및 옵션</h3>
                <button onclick="closeMenuModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-2 text-xs">
                <button onclick="exportLadder()" class="w-full p-2.5 bg-xg-bg hover:bg-xg-border rounded text-left flex items-center gap-2 border border-xg-border">
                    <i class="fa-solid fa-download text-xg-accent"></i> <span>프로그램 코드 내보내기 (JSON 복사)</span>
                </button>
                <button onclick="importLadder()" class="w-full p-2.5 bg-xg-bg hover:bg-xg-border rounded text-left flex items-center gap-2 border border-xg-border">
                    <i class="fa-solid fa-upload text-xg-accent"></i> <span>프로그램 코드 불러오기 (JSON 붙여넣기)</span>
                </button>
                <button onclick="clearLadder()" class="w-full p-2.5 bg-red-950/40 hover:bg-red-900/60 text-red-300 rounded text-left flex items-center gap-2 border border-red-800/50">
                    <i class="fa-solid fa-trash-can"></i> <span>전체 래더 초기화</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-xg-accent text-gray-950 px-4 py-2 rounded-lg font-bold text-xs shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-50">
        알림 메시지
    </div>

    <!-- Application Script Engine -->
    <script>
        // XBC Hardware Model Specifications (Relay & TR Outputs)
        const XBC_MODELS = {
            // Relay Output Series
            'XBC-DR14S': { inCount: 8, outCount: 6, inPrefix: 'P000', outPrefix: 'P002', type: 'RELAY' },
            'XBC-DR20S': { inCount: 12, outCount: 8, inPrefix: 'P000', outPrefix: 'P002', type: 'RELAY' },
            'XBC-DR32S': { inCount: 16, outCount: 16, inPrefix: 'P000', outPrefix: 'P002', type: 'RELAY' },

        // Hex/Dec Address Hexadecimal Conversion Helper for XG5000 P Address Labels
        function getPAddrString(index) {
            // Converts 0->P0000, 15->P000F, 16->P0010 etc.
            const hexStr = index.toString(16).toUpperCase();
            return 'P' + hexStr.padStart(4, '0');
        }

        window.onload = function() {
            initMemory();
            renderIOPanel();
            loadExample('self_hold');
        };

        function initMemory() {
            for (let i = 0; i < 256; i++) {
                memory.P[getPAddrString(i)] = false;
                memory.M[`M${i.toString().padStart(4, '0')}`] = false;
                memory.D[`D${i.toString().padStart(4, '0')}`] = 0;
            }
        }

        // Change Active XBC-S Model
        function changeModel() {
            selectedModelKey = document.getElementById('model-select').value;
            renderIOPanel();
            showToast(`모델이 [${selectedModelKey}]로 변경되었습니다.`);
        }

        // Render IO Console Dynamic Controls
        function renderIOPanel() {
            const spec = XBC_MODELS[selectedModelKey];
            const inputContainer = document.getElementById('input-switches');
            const outputContainer = document.getElementById('output-lamps');

            document.getElementById('input-count-label').innerText = `${spec.inCount}점`;
            document.getElementById('output-count-label').innerText = `${spec.outCount}점`;
            document.getElementById('output-type-label').innerText = spec.type === 'RELAY' ? '릴레이 (Relay)' : 'TR (NPN)';

            inputContainer.innerHTML = '';
            outputContainer.innerHTML = '';

            // Generate Input Switches (P0000...)
            for (let i = 0; i < spec.inCount; i++) {
                const pAddr = getPAddrString(i);
                const btn = document.createElement('button');
                btn.id = `sw-${pAddr}`;
                btn.className = `p-1.5 rounded border flex flex-col items-center justify-center transition ${
                    memory.P[pAddr] ? 'bg-green-600 border-green-400 text-white' : 'bg-xg-bg border-xg-border text-gray-400'
                }`;
                btn.innerHTML = `<span class="font-mono text-[10px] font-bold">${pAddr}</span><i class="fa-solid fa-toggle-on text-[10px] mt-0.5"></i>`;
                
                btn.onclick = () => {
                    memory.P[pAddr] = !memory.P[pAddr];
                    updateIOUI();
                };
                inputContainer.appendChild(btn);
            }

            // Generate Relay Output Status Indicators
            const outBaseIndex = spec.outPrefix === 'P004' ? 64 : 32;
            for (let i = 0; i < spec.outCount; i++) {
                const pAddr = getPAddrString(outBaseIndex + i);
                const lamp = document.createElement('div');
                lamp.id = `lamp-${pAddr}`;
                lamp.className = `p-1.5 rounded border border-xg-border bg-xg-bg flex flex-col items-center justify-center transition`;
                lamp.innerHTML = `
                    <span class="font-mono text-[10px] font-bold text-gray-400">${pAddr}</span>
                    <div class="flex items-center gap-1 mt-0.5">
                        <div class="w-3 h-3 rounded-full bg-gray-700 shadow-inner lamp-led"></div>
                        ${spec.type === 'RELAY' ? '<i class="fa-solid fa-bolt text-[9px] text-gray-600 relay-icon"></i>' : ''}
                    </div>`;
                outputContainer.appendChild(lamp);
            }
        }
